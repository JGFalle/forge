[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-application-pipeline"
version = "0.1.0"
description = "Unified job application pipeline: PDF drop to tailored resume, cover letter, and people intel"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.30",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "reportlab>=4.2",
    "tqdm>=4.66",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
include = ["pipeline*", "utils*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
